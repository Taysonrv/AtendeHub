<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AtendeHub · Atendimento</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/styles.css"></head>
<body><div class="shell"><aside><a class="brand" href="/">a<span>AtendeHub</span></a><p class="nav-label">ATENDIMENTO</p><nav aria-label="Principal"><button data-view="dashboard" class="active">Visão geral</button><button data-view="tickets">Chamados</button><button data-view="clients">Clientes</button></nav><div class="aside-footer">Versão de validação<br><span>Seu atendimento, organizado.</span></div></aside><main><header><div><span class="eyebrow">SEU ESPAÇO DE TRABALHO</span><h1 id="page-title">Visão geral</h1></div><button class="primary" id="new-ticket">+ Novo chamado</button></header><div class="notice">Ambiente local de validação · Cadastre apenas informações fictícias.</div><section id="content" aria-live="polite"></section></main></div>

<dialog id="detail"><div class="dialog-header"><h2 id="detail-title"></h2><button class="icon" id="close-detail" aria-label="Fechar">×</button></div><div id="detail-content"></div></dialog><div id="toast" role="status"></div><script type="module" src="/app.js"></script></body></html>
